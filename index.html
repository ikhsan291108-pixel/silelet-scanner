

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>SILELET QR Scanner</title>
<style>
*{box-sizing:border-box}
:root{--bg:#06130f;--panel:#0d2119;--green:#16b891;--mint:#a3f4d4;--gold:#d8bd7a;--text:#f4fbf7;--muted:#91ada0;--line:rgba(190,235,213,.13);--danger:#ff727a;--shadow:0 25px 70px rgba(0,0,0,.4)}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at 50% -10%,#1d6046 0%,#0a251a 38%,#030a07 100%);color:var(--text)}
body{padding:0}.app{max-width:760px;min-height:100vh;margin:auto;background:linear-gradient(160deg,rgba(8,30,21,.97),rgba(4,15,10,.99));border-inline:1px solid rgba(190,235,213,.07);overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:22px 20px 20px;background:linear-gradient(120deg,rgba(18,91,62,.65),rgba(8,35,24,.35));border-bottom:1px solid var(--line);backdrop-filter:blur(20px)}
.logo{width:52px;height:52px;flex:0 0 52px;border-radius:18px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,#28d6a5,#087354);border:1px solid rgba(255,255,255,.22);box-shadow:0 9px 30px rgba(22,184,145,.25)}
h1{font-size:20px;letter-spacing:-.5px;font-weight:850;margin:0}.sub{font-size:11px;color:#b3d2c2;margin-top:6px;line-height:1.5}
main{padding:18px 17px 30px}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 13px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}.live{font-size:10px;color:var(--mint);background:rgba(22,184,145,.1);border:1px solid rgba(22,184,145,.25);border-radius:999px;padding:6px 10px;white-space:nowrap}
.stage{position:relative;background:#020805;border-radius:26px;overflow:hidden;aspect-ratio:3/4;max-height:68vh;min-height:300px;border:1px solid rgba(163,244,212,.2);box-shadow:var(--shadow)}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 22%,transparent 72%,rgba(0,0,0,.4))}
video{width:100%;height:100%;object-fit:cover;display:block}.frame{position:absolute;z-index:2;inset:22% 14%;border:1.5px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 0 0 9999px rgba(0,0,0,.4),inset 0 0 22px rgba(22,184,145,.12);pointer-events:none}.frame:before,.frame:after{content:"";position:absolute;width:34px;height:34px;border:solid #49e6b6}.frame:before{top:-2px;left:-2px;border-width:4px 0 0 4px;border-radius:14px 0 0}.frame:after{bottom:-2px;right:-2px;border-width:0 4px 4px 0;border-radius:0 0 14px}
.hint{position:absolute;z-index:3;left:50%;bottom:17px;transform:translateX(-50%);white-space:nowrap;padding:9px 15px;border-radius:999px;background:rgba(2,18,11,.8);border:1px solid rgba(255,255,255,.16);font-size:11px;color:#e7fff5;backdrop-filter:blur(12px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button,select{width:100%;min-height:50px;border:1px solid var(--line);border-radius:15px;padding:12px 14px;font:inherit;font-size:13px;outline:none;transition:transform .15s,filter .15s}button{background:linear-gradient(135deg,#1bc99c,#087b5f);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 9px 24px rgba(8,121,93,.2)}button:active{transform:scale(.98);filter:brightness(.93)}.secondary{background:linear-gradient(145deg,#153a2b,#10271d);color:#e4f8ed;box-shadow:none;border-color:var(--line)}.danger{background:rgba(255,114,122,.08);color:#ff9da2;border-color:rgba(255,114,122,.25);box-shadow:none}.wide{grid-column:1/-1}select{background:#10271d;color:var(--text)}select option{background:#10271d;color:#fff}
.section-label{font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin:22px 3px 9px;display:flex;align-items:center;gap:10px}.section-label:after{content:"";height:1px;background:var(--line);flex:1}.status,.result{padding:15px 16px;margin-top:9px;border-radius:17px;background:linear-gradient(145deg,#112c20,#0b1e15);border:1px solid var(--line);font-size:13px;line-height:1.55;word-break:break-word;box-shadow:0 8px 24px rgba(0,0,0,.16)}.status{color:#d3e9dc}.result{background:linear-gradient(135deg,rgba(13,119,86,.2),#0b2117);border-color:rgba(22,184,145,.22);font-weight:750;color:var(--mint)}.hide{display:none}
@media(min-width:700px){.app{box-shadow:0 0 100px rgba(0,0,0,.35)}main{padding:22px 22px 35px}}@media(max-width:430px){header{padding:17px 15px}.logo{width:46px;height:46px;flex-basis:46px;border-radius:16px}h1{font-size:18px}main{padding:14px 12px 25px}.stage{border-radius:23px;min-height:285px}.grid{gap:8px}button,select{min-height:47px;padding:11px;font-size:12px}.hint{font-size:10px}}
</style>
</head>
<body><div class="app">
<header><div class="logo">⌗</div><div><h1>SILELET <span style="color:#75e7bf">Scanner</span></h1><div class="sub">SMART ATTENDANCE · QR 2D · ANDROID & IPHONE</div></div></header>
<main>
<div class="hero"><div class="eyebrow">Pemindai Kehadiran</div><div class="live">● LIVE SCAN</div></div><div class="stage"><video id="video" autoplay muted playsinline></video><div class="frame"></div><div class="hint">Arahkan QR tepat di dalam bingkai</div></div>
<div class="grid">
<button id="start">▶ Mulai Kamera</button><button id="flip" class="secondary">🔄 Depan / Belakang</button>
<select id="camera" class="wide"><option value="">Pilih kamera</option></select>
<button id="stop" class="danger">⏹ Stop</button><button id="photo" class="secondary">📸 Scan Foto</button><button id="soundTest" class="wide secondary">🔊 TES SUARA ABSENSI</button>
<input id="file" class="hide" type="file" accept="image/*" capture="environment">
</div>
<div class="section-label">Status Sistem</div><div id="status" class="status">Siap. Tekan Mulai Kamera.</div><div id="result" class="result">Belum ada QR terbaca.</div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),video=$('video'),status=$('status'),result=$('result'),camera=$('camera');
const params=new URLSearchParams(location.search),returnOrigin=params.get('returnOrigin')||'',nonce=params.get('nonce')||'';
let controls=null,reader=null,devices=[],facing='environment',running=false,delivering=false,lastCode='',lastTime=0;

function post(type,data={}) {
  if(!window.opener||window.opener.closed||!returnOrigin){return false}
  try{window.opener.postMessage({...data,type,nonce},returnOrigin);return true}catch(e){return false}
}
function say(s){status.textContent=s}
function stop(){
  running=false;delivering=false;
  try{controls?.stop()}catch(e){}
  controls=null;
  try{video.pause();video.srcObject=null}catch(e){}
}
function friendly(e){
 const n=e?.name||'';
 if(n==='NotAllowedError'||n==='PermissionDeniedError')return 'Izin kamera ditolak. Izinkan kamera untuk situs GitHub Pages di pengaturan browser.';
 if(n==='NotFoundError'||n==='DevicesNotFoundError')return 'Kamera tidak ditemukan pada perangkat.';
 if(n==='NotReadableError'||n==='TrackStartError')return 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain.';
 if(n==='OverconstrainedError'||n==='ConstraintNotSatisfiedError')return 'Kamera pilihan tidak tersedia. Pilih kamera lain.';
 return e?.message||'Kamera gagal dibuka. Periksa izin kamera dan HTTPS.';
}
async function enumerate(){
 try{devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(e){devices=[]}
 const old=camera.value;camera.innerHTML='<option value="">Pilih kamera (otomatis)</option>';
 devices.forEach((d,i)=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`Kamera ${i+1}`;camera.appendChild(o)});
 if(old&&devices.some(d=>d.deviceId===old))camera.value=old;
}
function selectedConstraints(){
 const id=camera.value;
 if(id)return {audio:false,video:{deviceId:{exact:id}}};
 return {audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}};
}
async function startCamera(){
 await primeAudio();
 stop();
 if(!navigator.mediaDevices?.getUserMedia)throw Error('Buka scanner melalui HTTPS di Chrome/Safari terbaru.');
 say('Meminta izin dan membuka kamera…');
 // Use getUserMedia once, with fallback that does not require exact camera id.
 let stream;
 try{stream=await navigator.mediaDevices.getUserMedia(selectedConstraints())}
 catch(first){
   try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing}}})}
   catch(second){
     try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true})}
     catch(last){throw last||second||first}
   }
 }
 video.srcObject=stream;
 await new Promise((resolve,reject)=>{
   if(video.readyState>=2){resolve();return}
   video.onloadedmetadata=()=>resolve();
   video.onerror=()=>reject(Error('Video kamera tidak dapat dimuat.'));
   setTimeout(()=>video.readyState>=2?resolve():reject(Error('Kamera tidak memberi gambar.')),8000);
 });
 await video.play();
 running=true;
 await enumerate();
 const track=stream.getVideoTracks()[0],settings=track?.getSettings?.()||{};
 if(settings.deviceId)camera.value=settings.deviceId;
 const label=devices.find(d=>d.deviceId===settings.deviceId)?.label||'Kamera aktif';
 say('✓ '+label+'. Arahkan QR ke kotak.');
 result.textContent='Kamera aktif. Menunggu QR…';
 post('SILELET_SCANNER_STATUS',{status:'Kamera aktif',facing:settings.facingMode||facing});
 await decodeLoop();
}
async function decodeLoop(){
 if(!running)return;
 if(!window.ZXingBrowser){say('Library QR gagal dimuat. Periksa koneksi internet lalu muat ulang.');return}
 reader=new ZXingBrowser.BrowserQRCodeReader();
 // The ZXing Browser API decodes the already-running video element.
 const loop=async()=>{
   if(!running)return;
   try{
     if(video.readyState>=2){
       const res=await reader.decodeOnceFromVideoElement(video);
       if(res){deliver(res.getText());}
     }
   }catch(e){/* no QR in this frame is normal */}
   if(running)setTimeout(loop,120);
 };
 loop();
}

// Audio feedback: spoken Indonesian message plus a short tone.
// AudioContext is resumed after the user starts the camera, satisfying mobile autoplay rules.
let sileletAudioCtx = null;
let lastAudioAt = 0;

async function primeAudio(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      sileletAudioCtx = sileletAudioCtx || new AC();
      if (sileletAudioCtx.state === 'suspended') await sileletAudioCtx.resume();
    }
  } catch(e) { console.log('Audio init:', e); }
}

function beep(success){
  try {
    if (!sileletAudioCtx) return;
    const ctx = sileletAudioCtx;
    const freqs = success ? [880, 1175, 1568] : [440, 330];
    freqs.forEach((freq, i) => {
      const start = ctx.currentTime + i * (success ? 0.13 : 0.19);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.24, start + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.16);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start + 0.17);
    });
  } catch(e) { console.log('Beep error:', e); }
}

function announceAttendance(success, message){
  const now = Date.now();
  if (now - lastAudioAt < 900) return;
  lastAudioAt = now;
  beep(success);
  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(
        success ? 'Absensi berhasil' : (message || 'Absensi gagal')
      );
      utter.lang = 'id-ID';
      utter.rate = 0.92;
      utter.pitch = success ? 1.05 : 0.9;
      utter.volume = 1;
      window.speechSynthesis.speak(utter);
    } catch(e) { console.log('Speech error:', e); }
  }
}

function deliver(code){
 const now=Date.now();code=String(code||'').trim();
 if(!code||(code===lastCode&&now-lastTime<2500)||delivering)return;
 lastCode=code;lastTime=now;delivering=true;
 result.textContent='QR: '+code;
 say('QR terbaca. Mengirim ke SILELET…');
 const sent=post('SILELET_QR_SCAN',{code,scanId:(nonce||'scan')+':'+now});
 if(!sent){
   say('QR terbaca, tetapi SILELET tidak terhubung. Buka scanner dari tombol scanner di SILELET.');
   result.textContent='GAGAL TERHUBUNG: scanner tidak memiliki jendela induk SILELET.';
   delivering=false;return;
 }
 try{navigator.vibrate?.(80)}catch(e){}
 // Do not claim saved until the parent SILELET returns SILELET_SCAN_RESULT.
 setTimeout(()=>{if(delivering){say('Belum ada konfirmasi dari SILELET. Periksa koneksi/halaman SILELET.');result.textContent='QR terkirim ke halaman SILELET, menunggu konfirmasi database.';delivering=false}},12000);
}
async function flipCamera(){
 facing=facing==='environment'?'user':'environment';
 // Clear manual device selection so facingMode is honored.
 camera.value='';
 try{await startCamera()}catch(e){say('✕ '+friendly(e));post('SILELET_SCANNER_ERROR',{message:friendly(e)})}
}
$('start').onclick=async()=>{try{await startCamera()}catch(e){say('✕ '+friendly(e));post('SILELET_SCANNER_ERROR',{message:friendly(e)})}};
$('soundTest').onclick=async()=>{await primeAudio();announceAttendance(true);say('Tes suara: Absensi berhasil. Jika tidak terdengar, naikkan volume media dan nonaktifkan mode senyap.');};
$('flip').onclick=flipCamera;
$('stop').onclick=()=>{stop();say('Kamera dihentikan.');post('SILELET_SCANNER_STATUS',{status:'Kamera dihentikan'})};
camera.onchange=async()=>{if(camera.value){try{await startCamera()}catch(e){say('✕ '+friendly(e))}}};
$('photo').onclick=()=>$('file').click();
$('file').onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 try{
   say('Membaca QR dari foto…');
   if(!window.ZXingBrowser)throw Error('Library QR belum dimuat.');
   const url=URL.createObjectURL(f),img=new Image();
   img.onload=async()=>{
     try{const r=await new ZXingBrowser.BrowserQRCodeReader().decodeFromImageElement(img);deliver(r.getText())}
     catch(err){say('QR tidak ditemukan pada foto. Coba foto yang lebih jelas.')}
     finally{URL.revokeObjectURL(url)}
   };
   img.onerror=()=>{URL.revokeObjectURL(url);say('Foto tidak dapat dibaca.')};img.src=url;
 }catch(err){say(err.message||'Gagal membaca foto.')}finally{e.target.value=''}
};
addEventListener('message',e=>{
 if(returnOrigin&&e.origin!==returnOrigin)return;
 const d=e.data||{};if(nonce&&d.nonce!==nonce)return;
 if(d.type==='SILELET_STOP_SCANNER'){stop();say('Scanner dihentikan oleh SILELET.')}
 if(d.type==='SILELET_SCAN_RESULT'){
   delivering=false;
   const isSuccess = d.ok === true || d.success === true ||
     String(d.status || d.result || '').toLowerCase() === 'success' ||
     String(d.status || d.result || '').toLowerCase() === 'berhasil';
   if(isSuccess){
     say('✓ SILELET mengonfirmasi absensi berhasil.');
     result.textContent='TERSIMPAN: '+(d.name||d.message||'Absensi siswa berhasil disimpan.');
     announceAttendance(true);
   } else {
     const msg = d.message || d.error || 'Absensi gagal atau siswa ditolak';
     say('✕ SILELET menolak atau gagal menyimpan absensi.');
     result.textContent='GAGAL: '+msg;
     announceAttendance(false, msg);
   }
 }
});
addEventListener('load',async()=>{await enumerate();say('Siap. Tekan Mulai Kamera.')});
addEventListener('pagehide',stop);
})();
</script></body></html>
