
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>SILELET QR Scanner</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f7f8;--card:#fff;--text:#17323a;--muted:#6c7d83;
  --primary:#0f766e;--primary2:#0b5f59;--line:#dfe8ea;
  --danger:#b42318;--soft:#edf7f5;--shadow:0 8px 28px rgba(18,55,61,.08)
}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
body{padding:0}
.app{width:100%;max-width:620px;min-height:100vh;margin:auto;background:var(--bg)}
header{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:12px 16px;display:flex;align-items:center;gap:11px
}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);display:grid;place-items:center;font-size:21px;box-shadow:0 4px 12px rgba(15,118,110,.2)}
h1{font-size:16px;line-height:1.15;margin:0;font-weight:800}
.sub{font-size:11px;color:var(--muted);margin-top:3px}
main{padding:12px}
.stage{
  position:relative;background:#071a18;border-radius:18px;overflow:hidden;
  aspect-ratio:4/3;min-height:250px;max-height:62vh;
  box-shadow:var(--shadow);border:1px solid #d9e5e6
}
video{width:100%;height:100%;object-fit:cover;display:block}
.frame{
  position:absolute;left:18%;right:18%;top:17%;bottom:17%;
  border:2px solid rgba(255,255,255,.95);border-radius:18px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.30);pointer-events:none
}
.frame:after{
  content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;
  background:rgba(20,184,166,.9);box-shadow:0 0 10px rgba(20,184,166,.8)
}
.hint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  background:rgba(0,0,0,.58);color:#fff;border-radius:999px;
  padding:6px 10px;font-size:11px;white-space:nowrap
}
.controls{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,select{
  width:100%;height:42px;border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;font-size:13px;font-family:inherit;outline:none
}
button{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:750;cursor:pointer}
button:active{transform:scale(.985)}
.secondary{background:#fff;color:var(--text)}
.danger{background:#fff;color:var(--danger);border-color:#efc8c4}
.wide{grid-column:1/-1}
select{background:#fff;color:var(--text)}
.status,.result{
  margin-top:8px;border:1px solid var(--line);border-radius:11px;
  padding:9px 11px;background:var(--card);font-size:12px;line-height:1.4;
  box-shadow:0 2px 8px rgba(18,55,61,.04);word-break:break-word
}
.result{background:var(--soft);font-weight:700;color:#0b5f59}
.hide{display:none}
.filter-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-top:9px;box-shadow:0 2px 8px rgba(18,55,61,.04)}.filter-label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.filter-note{font-size:10px;color:var(--muted);margin-top:5px}.section-title{font-size:11px;font-weight:800;color:var(--muted);margin:13px 2px 6px;text-transform:uppercase;letter-spacing:.05em}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;
  background:#eef4f5;color:#53666b;font-size:10px;font-weight:700
}
@media(max-width:420px){
  main{padding:9px}.stage{border-radius:15px;min-height:235px}
  header{padding:10px 12px}.logo{width:36px;height:36px}
  button,select{height:40px;font-size:12px}
}
</style>
</head>
<body><div class="app">
<header>
      <div class="logo">📷</div>
      <div><h1>SILELET QR Scanner</h1><div class="sub">Scan absensi dengan cepat • QR 2D • Android & iPhone</div></div>
    </header>
<main>
<div class="filter-card">
  <div class="filter-label">Filter Kelas</div>
  <select id="classFilter">
    <option value="">Semua Kelas</option>
  </select>
  <div class="filter-note">Jika kelas dipilih, QR siswa dari kelas lain akan ditolak.</div>
</div>
<div class="stage"><video id="video" autoplay muted playsinline></video><div class="frame"></div></div>
<div class="grid">
<button id="start">▶ Mulai Kamera</button><button id="flip" class="secondary">🔄 Depan / Belakang</button>
<select id="camera" class="wide"><option value="">Pilih kamera</option></select>
<button id="stop" class="danger">⏹ Hentikan</button><button id="photo" class="secondary">📸 Dari Foto</button><button id="soundTest" class="wide secondary">🔊 Tes Suara</button>
<input id="file" class="hide" type="file" accept="image/*" capture="environment">
</div>
<div class="section-title">Status</div>
 <div id="status" class="status">Siap. Tekan Mulai Kamera.</div>
 <div id="result" class="result">Belum ada QR terbaca.</div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),video=$('video'),status=$('status'),result=$('result'),camera=$('camera');
const params=new URLSearchParams(location.search),returnOrigin=params.get('returnOrigin')||'',nonce=params.get('nonce')||'';
let controls=null,reader=null,devices=[],facing='environment',running=false,delivering=false,lastCode='',lastTime=0;
const classFilter=document.getElementById('classFilter'); let selectedClassId='';

function post(type,data={}) {
  if(!window.opener||window.opener.closed||!returnOrigin){return false}
  try{
    const payload={type,nonce:String(nonce||'').slice(0,80)};
    if(type==='SILELET_QR_SCAN'){
      payload.code=String(data.code||'').slice(0,256);
      payload.scanId=String(data.scanId||'').slice(0,100);
      payload.classId=String(data.classId||'').slice(0,100);
    }else{
      for(const k of ['status','facing','message']){
        if(data[k]!=null) payload[k]=String(data[k]).slice(0,300);
      }
    }
    window.opener.postMessage(payload,returnOrigin);
    return true;
  }catch(e){return false}
}
function say(s){status.textContent=s}
function stop(){
  running=false;delivering=false;
  try{controls?.stop()}catch(e){}
  controls=null;
  try{video.pause();video.srcObject=null}catch(e){}
}
function friendly(e){
 const n=e?.name||'';
 if(n==='NotAllowedError'||n==='PermissionDeniedError')return 'Izin kamera ditolak. Izinkan kamera untuk situs GitHub Pages di pengaturan browser.';
 if(n==='NotFoundError'||n==='DevicesNotFoundError')return 'Kamera tidak ditemukan pada perangkat.';
 if(n==='NotReadableError'||n==='TrackStartError')return 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain.';
 if(n==='OverconstrainedError'||n==='ConstraintNotSatisfiedError')return 'Kamera pilihan tidak tersedia. Pilih kamera lain.';
 return e?.message||'Kamera gagal dibuka. Periksa izin kamera dan HTTPS.';
}
async function enumerate(){
 try{devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(e){devices=[]}
 const old=camera.value;camera.innerHTML='<option value="">Pilih kamera (otomatis)</option>';
 devices.forEach((d,i)=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`Kamera ${i+1}`;camera.appendChild(o)});
 if(old&&devices.some(d=>d.deviceId===old))camera.value=old;
}
function selectedConstraints(){
 const id=camera.value;
 if(id)return {audio:false,video:{deviceId:{exact:id}}};
 return {audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}};
}
async function startCamera(){
 await primeAudio();
 stop();
 if(!navigator.mediaDevices?.getUserMedia)throw Error('Buka scanner melalui HTTPS di Chrome/Safari terbaru.');
 say('Meminta izin dan membuka kamera…');
 // Use getUserMedia once, with fallback that does not require exact camera id.
 let stream;
 try{stream=await navigator.mediaDevices.getUserMedia(selectedConstraints())}
 catch(first){
   try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing}}})}
   catch(second){
     try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true})}
     catch(last){throw last||second||first}
   }
 }
 video.srcObject=stream;
 await new Promise((resolve,reject)=>{
   if(video.readyState>=2){resolve();return}
   video.onloadedmetadata=()=>resolve();
   video.onerror=()=>reject(Error('Video kamera tidak dapat dimuat.'));
   setTimeout(()=>video.readyState>=2?resolve():reject(Error('Kamera tidak memberi gambar.')),8000);
 });
 await video.play();
 running=true;
 await enumerate();
 const track=stream.getVideoTracks()[0],settings=track?.getSettings?.()||{};
 if(settings.deviceId)camera.value=settings.deviceId;
 const label=devices.find(d=>d.deviceId===settings.deviceId)?.label||'Kamera aktif';
 say('✓ '+label+'. Arahkan QR ke kotak.');
 result.textContent='Kamera aktif. Menunggu QR…';
 post('SILELET_SCANNER_STATUS',{status:'Kamera aktif',facing:settings.facingMode||facing});
 await decodeLoop();
}
async function decodeLoop(){
 if(!running)return;
 if(!window.ZXingBrowser){say('Library QR gagal dimuat. Periksa koneksi internet lalu muat ulang.');return}
 reader=new ZXingBrowser.BrowserQRCodeReader();
 // The ZXing Browser API decodes the already-running video element.
 const loop=async()=>{
   if(!running)return;
   try{
     if(video.readyState>=2){
       const res=await reader.decodeOnceFromVideoElement(video);
       if(res){deliver(res.getText());}
     }
   }catch(e){/* no QR in this frame is normal */}
   if(running)setTimeout(loop,120);
 };
 loop();
}

// Audio feedback: spoken Indonesian message plus a short tone.
// AudioContext is resumed after the user starts the camera, satisfying mobile autoplay rules.
let sileletAudioCtx = null;
let lastAudioAt = 0;

async function primeAudio(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      sileletAudioCtx = sileletAudioCtx || new AC();
      if (sileletAudioCtx.state === 'suspended') await sileletAudioCtx.resume();
    }
  } catch(e) { console.log('Audio init:', e); }
}

function beep(success){
  try {
    if (!sileletAudioCtx) return;
    const ctx = sileletAudioCtx;
    const freqs = success ? [880, 1175, 1568] : [440, 330];
    freqs.forEach((freq, i) => {
      const start = ctx.currentTime + i * (success ? 0.13 : 0.19);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.24, start + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.16);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start + 0.17);
    });
  } catch(e) { console.log('Beep error:', e); }
}

function announceAttendance(success, message){
  const now = Date.now();
  if (now - lastAudioAt < 900) return;
  lastAudioAt = now;
  beep(success);
  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(
        success ? 'Absensi berhasil' : (message || 'Absensi gagal')
      );
      utter.lang = 'id-ID';
      utter.rate = 0.92;
      utter.pitch = success ? 1.05 : 0.9;
      utter.volume = 1;
      window.speechSynthesis.speak(utter);
    } catch(e) { console.log('Speech error:', e); }
  }
}

function normalizeScanCode(raw){
  let s=String(raw??'').trim();
  if(!s) return '';

  const pick=(v)=>{
    if(v==null) return '';
    if(typeof v==='string'){
      const x=v.trim();
      if(!x) return '';
      if(x.length<=256 && !/^[{\[]/.test(x)) return x;
      try{return pick(JSON.parse(x))}catch(e){}
      try{
        const u=new URL(x);
        for(const k of ['code','qr_token','qr','token','id_siswa','nisn','nis']){
          const q=u.searchParams.get(k);
          if(q) return String(q).trim();
        }
      }catch(e){}
      return '';
    }
    if(Array.isArray(v)){
      for(const item of v){const r=pick(item);if(r)return r}
      return '';
    }
    if(typeof v==='object'){
      for(const k of ['code','qr_token','qr','token','id_siswa','nisn','nis','id']){
        if(v[k]!=null){const r=pick(v[k]);if(r)return r}
      }
      return '';
    }
    return String(v).trim();
  };

  const out=pick(s);
  return out&&out.length<=256?out:'';
}

function deliver(code){
  const normalized=normalizeScanCode(code);
  if(!normalized){
    say('QR ditolak: data QR terlalu besar/tidak valid.');
    result.textContent='QR tidak berisi kode siswa yang valid.';
    delivering=false;
    return;
  }

  const now=Date.now();
  const codeSafe=normalized.slice(0,256);
  if((codeSafe===lastCode&&now-lastTime<2500)||delivering)return;

  lastCode=codeSafe;
  lastTime=now;
  delivering=true;
  result.textContent='QR: '+codeSafe;
  say('QR terbaca. Mengirim kode siswa…');

  const safeScanId=String(nonce||'scan').slice(0,80)+':'+now;
  const sent=post('SILELET_QR_SCAN',{code:codeSafe,scanId:safeScanId,classId:selectedClassId});

  if(!sent){
    say('QR terbaca, tetapi SILELET tidak terhubung. Buka scanner dari tombol scanner di SILELET.');
    result.textContent='GAGAL TERHUBUNG: scanner tidak memiliki jendela induk SILELET.';
    delivering=false;
    return;
  }

  try{navigator.vibrate?.(80)}catch(e){}
  setTimeout(()=>{
    if(delivering){
      say('Belum ada konfirmasi dari SILELET. Periksa koneksi/halaman SILELET.');
      result.textContent='QR terkirim ke halaman SILELET, menunggu konfirmasi database.';
      delivering=false;
    }
  },12000);
}

async function flipCamera(){
 facing=facing==='environment'?'user':'environment';
 // Clear manual device selection so facingMode is honored.
 camera.value='';
 try{await startCamera()}catch(e){say('✕ '+friendly(e));post('SILELET_SCANNER_ERROR',{message:friendly(e)})}
}
$('start').onclick=async()=>{try{await startCamera()}catch(e){say('✕ '+friendly(e));post('SILELET_SCANNER_ERROR',{message:friendly(e)})}};
$('soundTest').onclick=async()=>{await primeAudio();announceAttendance(true);say('Tes suara: Absensi berhasil. Jika tidak terdengar, naikkan volume media dan nonaktifkan mode senyap.');};
$('flip').onclick=flipCamera;
$('stop').onclick=()=>{stop();say('Kamera dihentikan.');post('SILELET_SCANNER_STATUS',{status:'Kamera dihentikan'})};
camera.onchange=async()=>{if(camera.value){try{await startCamera()}catch(e){say('✕ '+friendly(e))}}};
$('photo').onclick=()=>$('file').click();
$('file').onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 try{
   say('Membaca QR dari foto…');
   if(!window.ZXingBrowser)throw Error('Library QR belum dimuat.');
   const url=URL.createObjectURL(f),img=new Image();
   img.onload=async()=>{
     try{const r=await new ZXingBrowser.BrowserQRCodeReader().decodeFromImageElement(img);deliver(r.getText())}
     catch(err){say('QR tidak ditemukan pada foto. Coba foto yang lebih jelas.')}
     finally{URL.revokeObjectURL(url)}
   };
   img.onerror=()=>{URL.revokeObjectURL(url);say('Foto tidak dapat dibaca.')};img.src=url;
 }catch(err){say(err.message||'Gagal membaca foto.')}finally{e.target.value=''}
};
function renderClassOptions(list){
  if(!classFilter)return;
  const keep=selectedClassId;
  classFilter.innerHTML='<option value="">Semua Kelas</option>';
  (Array.isArray(list)?list:[]).forEach(c=>{
    const id=String(c.id_kelas||c.id||c.classId||'').trim();
    const name=String(c.nama_kelas||c.nama||c.name||id).trim();
    if(!id)return;
    const o=document.createElement('option'); o.value=id; o.textContent=name;
    classFilter.appendChild(o);
  });
  if(keep)classFilter.value=keep;
}
function requestClassList(){post('SILELET_REQUEST_CLASS_LIST',{});}
if(classFilter)classFilter.onchange=()=>{
  selectedClassId=String(classFilter.value||'');
  lastCode='';lastTime=0;delivering=false;
  say(selectedClassId?'Filter kelas aktif.':'Semua kelas diterima.');
  result.textContent=selectedClassId?'Scan dibatasi ke '+(classFilter.selectedOptions[0]?.textContent||selectedClassId):'Filter kelas: Semua';
  post('SILELET_CLASS_FILTER_CHANGED',{classId:selectedClassId});
};

addEventListener('message',e=>{
 if(returnOrigin&&e.origin!==returnOrigin)return;
 const d=e.data||{};if(nonce&&d.nonce!==nonce)return;
 if(d.type==='SILELET_STOP_SCANNER'){stop();say('Scanner dihentikan oleh SILELET.')}
 if(d.type==='SILELET_SCAN_RESULT'){
   delivering=false;
   const isSuccess = d.ok === true || d.success === true ||
     String(d.status || d.result || '').toLowerCase() === 'success' ||
     String(d.status || d.result || '').toLowerCase() === 'berhasil';
   if(isSuccess){
     say('✓ SILELET mengonfirmasi absensi berhasil.');
     result.textContent='TERSIMPAN: '+(d.name||d.message||'Absensi siswa berhasil disimpan.');
     announceAttendance(true);
   } else {
     const msg = d.message || d.error || 'Absensi gagal atau siswa ditolak';
     say('✕ SILELET menolak atau gagal menyimpan absensi.');
     result.textContent='GAGAL: '+msg;
     announceAttendance(false, msg);
   }
 }
});
addEventListener('load',async()=>{await enumerate();requestClassList();say('Siap. Pilih kelas untuk memfilter QR.')});
addEventListener('pagehide',stop);
})();
</script></body></html>
