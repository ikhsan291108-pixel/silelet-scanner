
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>SILELET Scanner LIVE</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--p:#0f766e;--bg:#07110f;--card:#0d1d1a;--text:#fff;--muted:#b7c9c5;--ok:#39c7a9;--danger:#ff8d8d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;justify-content:center}.wrap{width:100%;max-width:620px;min-height:100dvh;padding:18px 14px 28px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:var(--p);display:grid;place-items:center;font-size:24px;font-weight:800}.head h1{font-size:20px;margin:0}.head p{margin:2px 0 0;color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid #18322e;border-radius:22px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#reader{width:100%;min-height:360px;border-radius:18px;overflow:hidden;background:#000;display:grid;place-items:center}.placeholder{text-align:center;padding:30px;color:var(--muted)}.placeholder b{display:block;color:#fff;font-size:18px;margin-bottom:8px}.placeholder small{line-height:1.5}
#reader video{width:100%!important;height:auto!important;max-height:70vh;object-fit:cover;border-radius:18px}#reader__scan_region{border:0!important}#reader__dashboard{display:none!important}#reader img{display:none!important}
.status{min-height:44px;padding:11px 12px;border-radius:14px;background:#102722;color:#d8ece8;font-size:13px;line-height:1.4}.status.ok{background:#0d332c;color:#9ff0dc}.status.err{background:#3a1717;color:#ffc4c4}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{min-height:48px;border:0;border-radius:14px;font-weight:800;font-size:15px;padding:10px 14px;background:#e6efed;color:#18302d}.btn.primary{background:var(--p);color:#fff}.btn:disabled{opacity:.5}.note{font-size:12px;color:var(--muted);line-height:1.5}.hidden{display:none!important}
@media(max-width:430px){.wrap{padding:12px 10px 22px}.card{padding:10px;border-radius:18px}#reader{min-height:320px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">S</div><div><h1>Scanner LIVE SILELET</h1><p>QR 2D • Kamera belakang • scan otomatis</p></div></div>
  <div class="card">
    <div id="reader"><div class="placeholder"><b>📷 Menyiapkan kamera...</b><small>Izinkan akses kamera jika browser meminta izin.</small></div></div>
  </div>
  <div id="status" class="status">Menyiapkan scanner...</div>
  <div class="actions">
    <button id="start" class="btn primary">📷 Mulai Kamera</button>
    <button id="stop" class="btn">Stop</button>
  </div>
  <div class="card note">Arahkan kamera belakang ke QR 2D siswa. QR akan dibaca otomatis tanpa mengambil foto. Setelah terbaca, hasil dikirim kembali ke SILELET.</div>
</div>
<script>
'use strict';
var qs=new URLSearchParams(location.search);
var returnOrigin=qs.get('returnOrigin')||'';
var nonce=qs.get('nonce')||'';
var openerWindow=window.opener||null;
var scanner=null,started=false,lastCode='',lastAt=0;
function $(id){return document.getElementById(id)}
function setStatus(msg,type){var e=$('status');e.textContent=msg;e.className='status'+(type?' '+type:'')}
function validOrigin(){try{return new URL(returnOrigin).origin===returnOrigin}catch(e){return false}}
function send(type,data){if(!openerWindow||openerWindow.closed){setStatus('Jendela SILELET utama tidak ditemukan. Tutup scanner lalu buka dari tombol SCAN QR LIVE di SILELET.','err');return false}if(!validOrigin()){setStatus('Koneksi scanner tidak valid. Buka scanner dari SILELET.','err');return false}try{openerWindow.postMessage(Object.assign({type:type,nonce:nonce},data||{}),returnOrigin);return true}catch(e){setStatus('Gagal mengirim hasil ke SILELET.','err');return false}}
function onScanSuccess(decodedText){var code=String(decodedText||'').replace(/[\r\n\t]/g,'').trim();if(!code)return;var now=Date.now();if(code===lastCode&&now-lastAt<1800)return;lastCode=code;lastAt=now;setStatus('✓ QR terbaca: '+code+' — mengirim ke SILELET...','ok');send('SILELET_QR_SCAN',{code:code});}
function onScanFailure(){ }
async function startCamera(){if(started)return;if(typeof Html5Qrcode==='undefined'){setStatus('Library QR scanner gagal dimuat. Periksa koneksi internet.','err');return}started=true;$('start').disabled=true;setStatus('Meminta izin kamera...');try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:{exact:'environment'}},{fps:12,qrbox:function(viewfinderWidth,viewfinderHeight){var size=Math.floor(Math.min(viewfinderWidth,viewfinderHeight)*.72);size=Math.max(180,Math.min(size,360));return {width:size,height:size}},aspectRatio:1},onScanSuccess,onScanFailure);setStatus('📷 Kamera belakang aktif. Arahkan QR 2D ke kotak.','ok')}catch(e){try{if(scanner){await scanner.clear()}}catch(x){}scanner=null;started=false;$('start').disabled=false;setStatus('Kamera gagal dibuka: '+(e&&e.message||String(e))+' Pastikan izin kamera diizinkan.','err')}}
async function stopCamera(){try{if(scanner){await scanner.stop();await scanner.clear()}}catch(e){}scanner=null;started=false;$('start').disabled=false;$('reader').innerHTML='<div class="placeholder"><b>📷 Kamera berhenti</b><small>Tekan Mulai Kamera untuk menjalankan kembali.</small></div>';setStatus('Scanner berhenti.','')}
$('start').addEventListener('click',startCamera);$('stop').addEventListener('click',stopCamera);
window.addEventListener('message',function(ev){var d=ev.data||{};if(ev.origin!==location.origin&&d.type==='SILELET_STOP_SCANNER'&&d.nonce===nonce){stopCamera()};if(d.type==='SILELET_SCAN_RESULT'&&d.nonce===nonce){if(d.ok)setStatus('✓ '+(d.name||'Siswa')+' — '+(d.message||'Absensi berhasil'),'ok');else setStatus('Gagal: '+(d.message||'Absensi gagal'),'err')}});
window.addEventListener('beforeunload',function(){try{if(scanner)scanner.stop()}catch(e){}});
window.addEventListener('load',function(){if(!openerWindow){setStatus('Scanner harus dibuka dari tombol SCAN QR LIVE di SILELET.','err');return}startCamera()});
</script>
</body>
</html>
