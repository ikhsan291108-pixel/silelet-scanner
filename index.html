
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>SILELET QR Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071f1d;color:#fff;font-family:system-ui,Arial}.app{max-width:760px;min-height:100vh;margin:auto;background:#0b2926}
header{background:#0f766e;padding:16px}h1{font-size:20px;margin:0}.sub{font-size:12px;margin-top:4px}
main{padding:12px}.stage{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:3/4;max-height:70vh}
video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;inset:22% 14%;border:3px solid #fff;border-radius:20px;box-shadow:0 0 0 9999px #0004;pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button,select{width:100%;min-height:48px;border:0;border-radius:11px;padding:10px;font-size:15px}
button{background:#14b8a6;color:#fff;font-weight:700}.secondary{background:#164a45}.danger{background:#a82720}.wide{grid-column:1/-1}select{background:white;color:#111}
.status,.result{padding:12px;margin-top:10px;border-radius:11px;background:#103b36;font-size:13px;word-break:break-word}.result{background:#061714;font-weight:700}.hide{display:none}
</style>
</head>
<body><div class="app">
<header><h1>📷 SILELET QR Scanner</h1><div class="sub">QR 2D • Kamera depan/belakang • Android & iPhone</div></header>
<main>
<div class="stage"><video id="video" autoplay muted playsinline></video><div class="frame"></div></div>
<div class="grid">
<button id="start">▶ Mulai Kamera</button><button id="flip" class="secondary">🔄 Depan / Belakang</button>
<select id="camera" class="wide"><option value="">Pilih kamera (opsional)</option></select>
<button id="stop" class="danger">⏹ Stop</button><button id="photo" class="secondary">📸 Scan Foto</button>
<input id="file" class="hide" type="file" accept="image/*" capture="environment">
</div>
<div id="status" class="status">Siap. Tekan Mulai Kamera.</div><div id="result" class="result">Belum ada QR terbaca.</div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), video=$('video'), status=$('status'), result=$('result'), camera=$('camera');
const params=new URLSearchParams(location.search), returnOrigin=params.get('returnOrigin')||'', nonce=params.get('nonce')||'';
let stream=null, detector=null, controls=null, reader=null, devices=[], facing='environment', busy=false, lastCode='', lastTime=0;

function post(type,data={}) {
  if(!window.opener||!returnOrigin) return;
  try{window.opener.postMessage({...data,type,nonce},returnOrigin)}catch(e){}
}
function say(s){status.textContent=s}
function stop(){
  busy=false;
  try{if(controls)controls.stop()}catch(e){} controls=null;
  try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){} stream=null;
  try{video.pause();video.srcObject=null}catch(e){}
}
function friendly(e){
  const n=e?.name||'';
  if(n==='NotAllowedError'||n==='PermissionDeniedError')return 'Izin kamera ditolak. Izinkan kamera di browser.';
  if(n==='NotFoundError'||n==='DevicesNotFoundError')return 'Kamera tidak ditemukan.';
  if(n==='NotReadableError'||n==='TrackStartError')return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera lain.';
  if(n==='OverconstrainedError'||n==='ConstraintNotSatisfiedError')return 'Mode kamera tidak tersedia. Coba ganti kamera.';
  return 'Kamera gagal dibuka. Periksa izin kamera dan coba lagi.';
}
async function enumerate(){
  try{devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(e){devices=[]}
  camera.innerHTML='<option value="">Pilih kamera (opsional)</option>';
  devices.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`Kamera ${i+1}`;camera.appendChild(o)});
}
function deliver(code){
  const now=Date.now();
  if(!code||(code===lastCode&&now-lastTime<2000))return;
  lastCode=code;lastTime=now;
  result.textContent='QR terbaca: '+code;
  say('✓ QR terbaca. Mengirim ke SILELET…');
  post('SILELET_QR_SCAN',{code,scanId:nonce+':'+now});
  try{navigator.vibrate?.(80)}catch(e){}
}
async function startCamera(deviceId=''){
  stop();
  if(!navigator.mediaDevices?.getUserMedia)throw Error('Gunakan browser terbaru melalui HTTPS.');
  say('Membuka kamera…');

  // First request: use selected device if user explicitly selected it.
  // Otherwise request front/back with ideal, never exact.
  const constraints=deviceId
    ? {audio:false,video:{deviceId:{ideal:deviceId}}}
    : {audio:false,video:{facingMode:{ideal:facing}}};

  try{stream=await navigator.mediaDevices.getUserMedia(constraints)}
  catch(e1){
    // Fallback attempts requested facing mode without strict device constraints.
    try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing}})}
    catch(e2){
      // Last resort: any available camera, so browser can choose.
      try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true})}
      catch(e3){throw e3||e2||e1}
    }
  }
  video.srcObject=stream;
  await video.play();
  const track=stream.getVideoTracks()[0];
  const settings=track?.getSettings?.()||{};
  const actualId=settings.deviceId||deviceId;
  await enumerate();
  if(actualId)camera.value=actualId;
  const actualFacing=settings.facingMode||facing;
  say('✓ Kamera aktif. Arahkan QR ke kotak.');
  post('SILELET_SCANNER_STATUS',{status:'Kamera aktif.'});
  runDecoder();
}
async function runDecoder(){
  if(busy)return;
  busy=true;
  // Use native BarcodeDetector where available; it avoids repeatedly
  // allocating ZXing decode objects on every video frame.
  if('BarcodeDetector' in window){
    try{detector=new BarcodeDetector({formats:['qr_code']})}catch(e){detector=null}
  }
  if(detector){
    const loop=async()=>{
      if(!busy||!video.srcObject)return;
      try{
        if(video.readyState>=2){
          const found=await detector.detect(video);
          if(found?.length)deliver(found[0].rawValue);
        }
      }catch(e){}
      if(busy)requestAnimationFrame(()=>setTimeout(loop,90));
    };
    loop();
    return;
  }
  if(!window.ZXingBrowser){busy=false;say('Mesin QR tidak tersedia. Periksa internet lalu muat ulang.');return}
  reader=new ZXingBrowser.BrowserQRCodeReader();
  // ZXing callback decoder on live video. This fallback covers browsers
  // without native BarcodeDetector.
  try{
    controls=await reader.decodeFromVideoElement(video,(res)=>{
      if(res)deliver(res.getText());
    });
  }catch(e){busy=false;say('Gagal memulai pembaca QR. Tekan Mulai Kamera lagi.')}
}
async function flipCamera(){
  facing=facing==='environment'?'user':'environment';
  try{await startCamera('')}catch(e){say('✕ '+friendly(e));post('SILELET_SCANNER_ERROR',{message:friendly(e)})}
}
$('start').onclick=async()=>{try{await startCamera(camera.value)}catch(e){say('✕ '+friendly(e));post('SILELET_SCANNER_ERROR',{message:friendly(e)})}};
$('flip').onclick=flipCamera;
$('stop').onclick=()=>{stop();say('Kamera dihentikan.')};
camera.onchange=async()=>{if(camera.value){try{await startCamera(camera.value)}catch(e){say('✕ '+friendly(e))}}};
$('photo').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files?.[0];if(!f)return;
  try{
    say('Membaca foto…');
    const url=URL.createObjectURL(f),img=new Image();
    img.onload=async()=>{
      try{
        let code='';
        if('BarcodeDetector' in window){
          try{const bd=new BarcodeDetector({formats:['qr_code']});const a=await bd.detect(img);if(a.length)code=a[0].rawValue}catch(e){}
        }
        if(!code&&window.ZXingBrowser){
          const r=await new ZXingBrowser.BrowserQRCodeReader().decodeFromImageElement(img);code=r.getText();
        }
        if(!code)throw Error('QR tidak ditemukan pada foto.');
        deliver(code);
      }catch(err){say(err.message||'QR tidak ditemukan pada foto.')}
      finally{URL.revokeObjectURL(url)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);say('Foto tidak dapat dibaca.')};img.src=url;
  }catch(e){say('Gagal membaca foto.')}finally{e.target.value=''}
};
addEventListener('message',e=>{
  if(returnOrigin&&e.origin!==returnOrigin)return;
  const d=e.data||{};if(d.nonce!==nonce)return;
  if(d.type==='SILELET_STOP_SCANNER')stop();
  if(d.type==='SILELET_SCAN_RESULT')say(d.ok?'✓ Absensi diterima SILELET.':'✕ Absensi gagal: '+(d.message||'Periksa SILELET.'));
});
addEventListener('load',async()=>{
  await enumerate();
  say('Siap. Tekan Mulai Kamera.');
});
})();
</script></body></html>
